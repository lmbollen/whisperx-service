services:
  whisperx:
    build: .
    image: whisperx-service:local
    container_name: whisperx
    # Run as the host user so the bind-mounted cache stays owned by you
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      ASR_ENGINE: whisperx
      ASR_MODEL: ${ASR_MODEL:-small}
      ASR_DEVICE: cpu
      ASR_QUANTIZATION: int8
      HF_TOKEN: ${HF_TOKEN:-}
      # Keep every downloaded model inside ./cache
      HOME: /cache
      XDG_CACHE_HOME: /cache
      HF_HOME: /cache/huggingface
      TORCH_HOME: /cache/torch
      ASR_MODEL_PATH: /cache/whisper
    volumes:
      - ./cache:/cache
    restart: unless-stopped
